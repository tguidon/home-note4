<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Note4 · Wi-Fi setup</title>
<style>body{font:17px system-ui;background:#f3f0e9;color:#202922;margin:0;padding:30px 20px}main{max-width:420px;margin:5vh auto;background:#fff;padding:28px;border-radius:20px}h1{margin:8px 0}p{line-height:1.5;color:#58635c}label{display:block;margin:24px 0 7px;font-weight:650}input,button{font:inherit;box-sizing:border-box;width:100%;padding:14px;border:1px solid #b6c1b9;border-radius:9px}button{margin-top:24px;background:#245f46;color:white;cursor:pointer}small{color:#58635c}#status{white-space:pre-wrap}button:disabled{opacity:.5}</style>
<main><small>YOUR HOME, AT A GLANCE</small><h1>Home Note4</h1><p>Connect to your <b>2.4 GHz Wi-Fi</b>. Your network details stay on this device.</p><form id="setup"><label for="ssid">Network name</label><input id="ssid" name="ssid" required maxlength="32" autocomplete="off"><label for="password">Wi-Fi password</label><input id="password" name="password" type="password" maxlength="63" autocomplete="off"><p><small>Leave blank only for an open network.</small></p><button id="save">Save and connect</button></form><p id="status" role="status"></p><small>Wilton, CT 06897 · Weather · F1 · NFL<br>No account required.</small></main>
<script>document.querySelector('#setup').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#save'),s=document.querySelector('#status');b.disabled=true;s.textContent='Saving…';try{const r=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:document.querySelector('#ssid').value,password:document.querySelector('#password').value,token:'__TOKEN__'})});s.textContent=await r.text();if(!r.ok)b.disabled=false;else document.querySelector('#password').value=''}catch(err){s.textContent='Connection lost. Check the NOTE4 screen; if it has not restarted, reconnect to its setup Wi-Fi and try again.';b.disabled=false}});</script></html>
